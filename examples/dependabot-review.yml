# Copy to .github/workflows/dependabot-review.yml in the repository you want gated.
#
# Setup:
#   1. Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Dependabot.
#      (Dependabot-triggered runs cannot read normal Actions secrets.)
#   2. Set the toolchain step and test-command below for your project.
#   3. In branch protection (or a ruleset) for main, require the "dependabot-gate" check, and either
#      turn on the merge queue or "Require branches to be up to date before merging".
#      See the README section "Making sure what you tested is what lands".
name: Dependabot gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group: # re-runs the build and tests on the exact commit the merge queue will land

permissions:
  contents: read # change to `write` if you turn on auto-merge
  pull-requests: write # post the review comment
  issues: write # create and apply verdict labels

jobs:
  dependabot-gate:
    # Pull requests: check the PR author, not github.actor, so a human re-running the job still triggers it.
    # Merge queue: the action itself skips PRs that are not from Dependabot.
    if: github.event_name == 'merge_group' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dependabot-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # No `ref:` on purpose. On pull_request this checks out the PR merged into the
      # latest base branch, which is what will land. On merge_group it checks out the queue's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --- Your toolchain. Pick what your project needs. ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: 9.0.x }
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.12" }

      - uses: GH-ABN/depbotreviewer@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Builds and tests the update. Required for a pass. Examples:
          #   npm ci && npm test
          #   dotnet restore && dotnet build --no-restore && dotnet test --no-build
          #   pip install -r requirements.txt && pytest
          test-command: npm ci && npm test
          # fail-on: fail          # default: the check fails only when the update breaks something
          # fail-on: needs-human   # stricter: anything short of a verified pass fails the check
          # auto-merge: true       # merge automatically on a pass (needs contents: write)
